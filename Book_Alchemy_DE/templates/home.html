<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>

    <h2>Your Library</h2>

    {% for book in books %}
    <div style="margin-bottom: 20px;">
      <h3>{{ book.title }}</h3>
      <p>Author: {{ book.author.name }}</p>

      {% if book.isbn %}
      <img src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg"
           alt="Cover for {{ book.title }}">
      {% endif %}
    </div>
    {% endfor %}

  </body>
</html>
