<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>

    <h2>Your Library</h2>

    {% if message %}
    <p style="color: green;">{{ message }}</p>
    {% endif %}

    {% for book in books %}
    <div style="margin-bottom: 20px;">
      <h3>{{ book.title }}</h3>
      <p>Author: {{ book.author.name }}</p>

      {% if book.isbn %}
      <img src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg"
           alt="Cover for {{ book.title }}">
      {% endif %}

      <!-- Delete Button -->
      <form action="/book/{{ book.id }}/delete" method="POST" style="margin-top: 10px;">
        <button type="submit" style="color: red;">Delete Book</button>
      </form>
    </div>
    {% endfor %}

  </body>
</html>
